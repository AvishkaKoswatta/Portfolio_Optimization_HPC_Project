<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Optimization - HPC Performance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #f0fdf4;
    }

    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 128, 0, 0.1);
    }

    #output {
      white-space: pre-wrap;
      font-family: monospace;
      background-color: #ffffff;
      border-radius: 10px;
      padding: 15px;
      color: #000000;
    }
  </style>
</head>
<body>

  <div class="container py-4">
    <h2 class="mb-4 text-center fw-bold text-success">Portfolio Optimization - HPC Performance</h2>

    <div class="text-center mb-4">
      <button class="btn btn-success me-2" onclick="runCode('serial')">Run Serial</button>
      <button class="btn btn-success me-2" onclick="runCode('openmp')">Run OpenMP</button>
      <button class="btn btn-success me-2" onclick="runCode('mpi')">Run MPI</button>
      <button class="btn btn-success" onclick="runCode('hybrid')">Run Hybrid</button>
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card p-3">
          <h5 class="card-title text-success">Execution Output</h5>
          <div id="output"></div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card p-3">
          <h5 class="card-title text-success">Sharpe Ratio Allocation</h5>
          <canvas id="donutChart" height="200"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    function runCode(mode) {
      document.getElementById("output").textContent = "Running " + mode + "...";
      fetch(`/run?mode=${mode}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById("output").textContent = data.output;

          const regex = /(?:Allocation:|ALLOCATION:)[\s\S]*?([A-Z]{2,}[\s:]+[\d.]+%[\s\S]*)/i;
          const match = data.output.match(regex);
          if (match) {
            const lines = match[1].split('\n').filter(line => line.includes('%'));
            const labels = [];
            const values = [];

            lines.forEach(line => {
              const parts = line.trim().split(/[:\s]+/).filter(Boolean);
              const name = parts[0];
              const percent = parseFloat(parts[parts.length - 1].replace('%', ''));
              labels.push(name);
              values.push(percent);
            });

            updateDonutChart(labels, values);
          }
        })
        .catch(err => {
          document.getElementById("output").textContent = "Error: " + err;
        });
    }

    let donutChart;

    function updateDonutChart(labels, data) {
      const ctx = document.getElementById('donutChart').getContext('2d');

      if (donutChart) donutChart.destroy();

      donutChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            label: 'Portfolio Allocation (%)',
            data: data,
            backgroundColor: [
              '#2e7d32', // dark green
              '#66bb6a', // medium light green
              '#a5d6a7', // light green
              '#81c784', // leafy green
              '#388e3c'  // deep green
            ],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'right'
            }
          }
        }
      });
    }
  </script>
</body>
</html>
