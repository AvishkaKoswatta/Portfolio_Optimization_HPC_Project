<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Optimization - HPC Performance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Bootstrap Icons (optional, for icons) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #f3f4f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    h2 {
      color: #000000;
      font-weight: 700;
    }

    .btn-success {
      font-weight: 500;
      min-width: 120px;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    .btn-success:hover {
      background-color: #157347;
    }

    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 8px 20px rgba(0, 128, 0, 0.08);
      transition: transform 0.2s ease-in-out;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card-title {
      font-weight: 600;
      color: #000000;
      margin-bottom: 1rem;
    }

    #output {
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      background-color: #ffffff;
      border-radius: 0.5rem;
      padding: 1rem;
      color: #212529;
      max-height: 350px;
      overflow-y: auto;
      border: 1px solid #dee2e6;
    }

    #accuracy-value {
      margin-top: 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: #6c757d;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <h2 class="text-center mb-4">Portfolio Optimization - HPC Performance</h2>

    <div class="text-center mb-5">
      <button class="btn btn-success me-2" onclick="runCode('serial')"><i class="bi bi-cpu"></i> Run Serial</button>
      <button class="btn btn-success me-2" onclick="runCode('openmp')"><i class="bi bi-layers"></i> Run OpenMP</button>
      <button class="btn btn-success me-2" onclick="runCode('mpi')"><i class="bi bi-diagram-3"></i> Run MPI</button>
      <button class="btn btn-success" onclick="runCode('hybrid')"><i class="bi bi-cpu-fill"></i> Run Hybrid</button>
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card p-4 h-100">
          <h5 class="card-title">Execution Output</h5>
          <div id="output">Click a mode to begin execution...</div>
          <div id="accuracy-value"></div>
          <div id="execTime" class="text-muted small mt-2 fw-semibold"></div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card p-4 h-100">
          <h5 class="card-title">Sharpe Ratio Allocation</h5>
          <canvas id="donutChart" height="220"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    function runCode(mode) {
      document.getElementById("output").textContent = "Running " + mode + "...";
      document.getElementById("accuracy-value").textContent = "";
      document.getElementById("execTime").textContent = "";

      fetch(`/run?mode=${mode}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById("output").textContent = data.output;

          if (data.rmse !== null && data.rmse !== undefined) {
            document.getElementById("accuracy-value").textContent =
              "RMSE (Accuracy): " + data.rmse.toFixed(10);
          }

          if (data.time !== null && data.time !== undefined) {
            document.getElementById("execTime").textContent =
              "Execution Time: " + data.time;
          }

          const regex = /(?:Allocation:|ALLOCATION:)[\s\S]*?([A-Z]{2,}[\s:]+[\d.]+%[\s\S]*)/i;
          const match = data.output.match(regex);
          if (match) {
            const lines = match[1].split('\n').filter(line => line.includes('%'));
            const labels = [];
            const values = [];

            lines.forEach(line => {
              const parts = line.trim().split(/[:\s]+/).filter(Boolean);
              const name = parts[0];
              const percent = parseFloat(parts[parts.length - 1].replace('%', ''));
              labels.push(name);
              values.push(percent);
            });

            updateDonutChart(labels, values);
          }
        })
        .catch(err => {
          document.getElementById("output").textContent = "Error: " + err;
        });
    }

    let donutChart;

    function updateDonutChart(labels, data) {
      const ctx = document.getElementById('donutChart').getContext('2d');

      if (donutChart) donutChart.destroy();

      donutChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            label: 'Portfolio Allocation (%)',
            data: data,
            backgroundColor: [
              '#2e7d32',
              '#66bb6a',
              '#a5d6a7',
              '#81c784',
              '#388e3c'
            ],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'right',
              labels: {
                color: '#333',
                font: {
                  weight: '500'
                }
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
