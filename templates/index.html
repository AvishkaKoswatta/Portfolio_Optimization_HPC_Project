<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Optimization - HPC Performance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background: linear-gradient(to right, #f7f8fa, #e6ecf0);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
    }

    h2 {
      font-weight: 700;
      color: #1a1a1a;
    }

    .btn-modern {
      font-weight: 600;
      min-width: 130px;
      border-radius: 10px;
      padding: 10px 18px;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      color: white;
      border: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(46, 204, 113, 0.2);
    }

    .btn-modern:hover {
      background: linear-gradient(135deg, #27ae60, #229954);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(39, 174, 96, 0.3);
    }

    .card-modern {
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      padding: 24px;
      transition: 0.3s ease;
    }

    .card-modern:hover {
      transform: translateY(-4px);
    }

    .card-title {
      font-weight: 600;
      color: #222;
      margin-bottom: 1rem;
    }

    #output {
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      background: #f9f9f9;
      border-radius: 12px;
      padding: 1rem;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
    }

    #accuracy-value,
    #execTime {
      margin-top: 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: #6c757d;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <h2 class="text-center mb-5">Portfolio Optimization - HPC</h2>

    <div class="text-center mb-5 d-flex flex-wrap justify-content-center gap-3">
      <button class="btn btn-modern" onclick="runCode('serial')"><i class="bi bi-cpu me-1"></i> Serial</button>
      <button class="btn btn-modern" onclick="runCode('openmp')"><i class="bi bi-layers me-1"></i> OpenMP</button>
      <button class="btn btn-modern" onclick="runCode('mpi')"><i class="bi bi-diagram-3 me-1"></i> MPI</button>
      <button class="btn btn-modern" onclick="runCode('hybrid')"><i class="bi bi-cpu-fill me-1"></i> Hybrid</button>
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card-modern h-100">
          <h5 class="card-title">Execution Output</h5>
          <div id="output">Click a mode to begin execution...</div>
          <div id="accuracy-value"></div>
          <div id="execTime"></div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card-modern h-100">
          <h5 class="card-title">Sharpe Ratio Allocation</h5>
          <canvas id="donutChart" height="220"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    function runCode(mode) {
      document.getElementById("output").textContent = "Running " + mode + "...";
      document.getElementById("accuracy-value").textContent = "";
      document.getElementById("execTime").textContent = "";

      fetch(`/run?mode=${mode}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById("output").textContent = data.output;

          if (data.rmse !== null && data.rmse !== undefined) {
            document.getElementById("accuracy-value").textContent =
              "RMSE (Accuracy): " + data.rmse.toFixed(10);
          }

          if (data.time !== null && data.time !== undefined) {
            document.getElementById("execTime").textContent =
              "Execution Time: " + data.time;
          }

          const regex = /(?:Allocation:|ALLOCATION:)[\s\S]*?([A-Z]{2,}[\s:]+[\d.]+%[\s\S]*)/i;
          const match = data.output.match(regex);
          if (match) {
            const lines = match[1].split('\n').filter(line => line.includes('%'));
            const labels = [];
            const values = [];

            lines.forEach(line => {
              const parts = line.trim().split(/[:\s]+/).filter(Boolean);
              const name = parts[0];
              const percent = parseFloat(parts[parts.length - 1].replace('%', ''));
              labels.push(name);
              values.push(percent);
            });

            updateDonutChart(labels, values);
          }
        })
        .catch(err => {
          document.getElementById("output").textContent = "Error: " + err;
        });
    }

    let donutChart;

    function updateDonutChart(labels, data) {
      const ctx = document.getElementById('donutChart').getContext('2d');

      if (donutChart) donutChart.destroy();

      donutChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            label: 'Portfolio Allocation (%)',
            data: data,
            backgroundColor: [
              '#2ecc71', '#27ae60', '#1abc9c', '#16a085', '#149174'
            ],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: '#444',
                font: {
                  weight: '500'
                }
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
