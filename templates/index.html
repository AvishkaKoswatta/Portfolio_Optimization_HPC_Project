<!DOCTYPE html>
<html>
<head>
  <title>Parallel Performance Web</title>
</head>
<body>
  <h1>Portfolio Optimization - HPC Performance</h1>

  <button onclick="runCode('serial')">Run Serial</button>
  <button onclick="runCode('openmp')">Run OpenMP</button>
  <button onclick="runCode('mpi')">Run MPI</button>
  <button onclick="runCode('hybrid')">Run Hybrid</button>

  <pre id="output" style="margin-top:20px; background:#eee; padding:10px;"></pre>

  <script>
    function runCode(mode) {
      document.getElementById("output").textContent = "Running " + mode + "...";
      fetch(`/run?mode=${mode}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById("output").textContent = data.output;
        })
        .catch(err => {
          document.getElementById("output").textContent = "Error: " + err;
        });
    }
  </script>
</body>
</html>
